name: SDCT-776 3B.1 no-job-context test-only failure

on:
  push:

jobs:
  no-job-context:
    name: no-job-context
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: datad0g.com
      DD_CIVISIBILITY_AGENTLESS_ENABLED: true
      DD_SERVICE: sdct776-pr-signals
      SDCT776_NO_JOB_CONTEXT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Record a failed test without CI job context
        continue-on-error: true
        # Preserve GitHub pipeline metadata but remove only the test process's job label.
        run: env -u GITHUB_JOB go test -tags=sdct776 -run '^TestSDCT776NoJobContext$' -v ./sdct776/scenarios
      - name: Keep the test-only job successful
        run: echo "The failed test has no CI job context."
