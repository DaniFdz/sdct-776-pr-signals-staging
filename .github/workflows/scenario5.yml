name: SDCT-776 Scenario 5 - New Flaky Test

on:
  push:
    branches:
      - dani.fernandez/sdct776-scenario5-new-flaky

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: datad0g.com
      DD_CIVISIBILITY_AGENTLESS_ENABLED: true
      DD_SERVICE: sdct776-pr-signals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: First execution fails for fresh test identity
        continue-on-error: true
        run: go test -tags=sdct776 -run '^TestNewFlakyPaymentAuth$' -v ./sdct776/scenarios
      - name: Second execution passes for flaky test, but job is marked failed
        run: |
          go test -tags=sdct776 -run '^TestNewFlakyPaymentAuth$' -v ./sdct776/scenarios
          exit 1
