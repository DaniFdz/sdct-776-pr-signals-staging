name: SDCT-776 Scenario 4 - High Volume Test Failures

on:
  push:
    branches:
      - dani.fernandez/sdct776-scenario4-high-volume

jobs:
  test-suite:
    name: test-suite
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: datad0g.com
      DD_CIVISIBILITY_AGENTLESS_ENABLED: true
      DD_SERVICE: sdct776-pr-signals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Run high-volume test failures
        run: go test -tags=sdct776 -run '^TestTruncationBatch' -v ./sdct776/scenarios
