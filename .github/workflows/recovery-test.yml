name: SDCT-770 recovery verification

on:
  pull_request:
  workflow_dispatch:

jobs:
  fast-job:
    name: fast-job
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: datad0g.com
      DD_CIVISIBILITY_AGENTLESS_ENABLED: true
      DD_SERVICE: sdct776-pr-signals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Run recovery test scenario
        run: |
          sleep 5
          go test -tags=sdct776 -run '^TestRecoveryScenario$' -v ./sdct776/scenarios
      - name: Ingestion buffer for test telemetry
        if: always()
        run: sleep 10
