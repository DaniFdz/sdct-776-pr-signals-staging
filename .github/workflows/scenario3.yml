name: SDCT-776 Scenario 3 - Multiple Jobs With Test Failures

on:
  push:
    branches:
      - dani.fernandez/sdct776-scenario3-multi-jobs

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: datad0g.com
      DD_CIVISIBILITY_AGENTLESS_ENABLED: true
      DD_SERVICE: sdct776-pr-signals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Run unit tests
        run: go test -tags=sdct776 -run '^TestUser' -v ./sdct776/scenarios

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: datad0g.com
      DD_CIVISIBILITY_AGENTLESS_ENABLED: true
      DD_SERVICE: sdct776-pr-signals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Run integration tests
        run: go test -tags=sdct776 -run '^(TestPaymentCapture|TestRefund)$' -v ./sdct776/scenarios
