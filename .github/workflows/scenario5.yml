name: SDCT-776 Scenario 5 - New Flaky Test

on:
  push:
    branches:
      - dani.fernandez/sdct776-scenario5-new-flaky

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: datad0g.com
      DD_CIVISIBILITY_AGENTLESS_ENABLED: true
      DD_SERVICE: sdct776-pr-signals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Run test suite with retry
        continue-on-error: true
        run: go test -tags=sdct776 -run '^TestNewFlakyPaymentAuth$' -v ./sdct776/scenarios
      - name: Run all tests (flaky passes on retry, failing test fails)
        run: go test -tags=sdct776 -run '^(TestNewFlakyPaymentAuth|TestPaymentCaptureFailure)$' -v ./sdct776/scenarios
