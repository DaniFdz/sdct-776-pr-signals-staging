name: SDCT-775 rolling debounce verification

on:
  workflow_dispatch:
  push:
    branches:
      - dani.fernandez/sdct775-debounce-test
  pull_request:

jobs:
  fast-job:
    name: unit-test-packages
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: datad0g.com
      DD_CIVISIBILITY_AGENTLESS_ENABLED: true
      DD_SERVICE: sdct776-pr-signals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Fast failure after 1s
        run: |
          sleep 1
          go test -tags=sdct776 -run '^TestRetryPolicy$' -v ./sdct776/scenarios
