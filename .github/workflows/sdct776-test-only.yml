name: SDCT-776 3A.3 first-time-flaky test-only failure

on:
  push:

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: datad0g.com
      DD_CIVISIBILITY_AGENTLESS_ENABLED: true
      DD_SERVICE: sdct776-pr-signals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: First execution fails for the fresh test identity
        continue-on-error: true
        env:
          SDCT776_NEW_FLAKY_FAIL: '1'
        run: go test -tags=sdct776 -run '^TestSDCT776NewRepoFreshNewFlaky$' -v ./sdct776/scenarios
      - name: Second execution passes for the same test identity
        env:
          SDCT776_NEW_FLAKY_FAIL: '0'
        run: go test -tags=sdct776 -run '^TestSDCT776NewRepoFreshNewFlaky$' -v ./sdct776/scenarios
      - name: Keep the test-only job successful
        run: echo "The first-time-flaky test failure is intentionally test-only."
