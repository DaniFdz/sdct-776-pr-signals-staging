name: SDCT-776 1.1 correlated non-flaky failures

on:
  push:
    branches:
      - dani.fernandez/sdct776-newrepo-correlated

jobs:
  sdct776-correlated:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: datad0g.com
      DD_CIVISIBILITY_AGENTLESS_ENABLED: true
      DD_SERVICE: sdct776-pr-signals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Run three intentional non-flaky failures
        run: go test -tags=sdct776 -run '^TestRetryPolicy' -v ./sdct776/scenarios
