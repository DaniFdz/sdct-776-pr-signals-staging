name: SDCT-775 rolling debounce verification

on:
  workflow_dispatch:
  push:
    branches:
      - dani.fernandez/sdct775-debounce-test
  pull_request:

jobs:
  fast-job:
    name: sdct775-fast-job
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: datad0g.com
      DD_CIVISIBILITY_AGENTLESS_ENABLED: true
      DD_SERVICE: sdct776-pr-signals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Fast failure after 1s (Required)
        run: |
          sleep 1
          go test -tags=sdct776 -run '^TestRetryPolicy$' -v ./sdct776/scenarios

  medium-job:
    name: sdct775-medium-job
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: datad0g.com
      DD_CIVISIBILITY_AGENTLESS_ENABLED: true
      DD_SERVICE: sdct776-pr-signals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Medium failure after 20s (Optional)
        run: |
          sleep 20
          go test -tags=sdct776 -run '^TestRetryPolicyBackoff$' -v ./sdct776/scenarios

  long-job:
    name: sdct775-long-job
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: datad0g.com
      DD_CIVISIBILITY_AGENTLESS_ENABLED: true
      DD_SERVICE: sdct776-pr-signals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Long failure after 40s (Optional)
        run: |
          sleep 40
          go test -tags=sdct776 -run '^TestRetryPolicyBudget$' -v ./sdct776/scenarios
